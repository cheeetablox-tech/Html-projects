<!DOCTYPE html>
<html>
<head>
    <title>Make changes to a rectangle</title>
    <style>
        h2 {
            text-align: center;
        }
        .rectangle {
            border: 1px solid black;
            width: 200px;
            height: 200px;
            margin: auto;
        }
        .buttons {
            padding: 20px;
            width: 200px;
            margin: auto;
            text-align: center;
        }
    </style>
</head>

<body>
<h2>Make changes to the rectangle</h2>

<div class="rectangle"></div>

<div class="buttons">
    <button onclick="changeToCircle()">Make Circle</button>
    <button onclick="hideRectangle()">Hide</button>
    <button onclick="showRectangle()">Show</button>
</div>

<script>
    let div = document.querySelector('.rectangle');

    function changeToCircle() {
        div.style.borderRadius = '50%';
    }

    function hideRectangle() {
        div.style.display = 'none';
    }

    function showRectangle() {
        div.style.display = 'block';
    }

div.onmouseenter = function () {
    div.style.backgroundColor = 'red';
};

div.onmouseleave = function () {
    div.style.backgroundColor = 'transparent';
};
</script>
</body>
</html>
